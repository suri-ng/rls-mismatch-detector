services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      # Adjust the variable name to whatever config.py actually reads.
      - OPENAI_API_KEY=${OPENAI_API_KEY}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Inside the compose network, containers reach each other by
      # service name, not localhost — this overrides the .env.local
      # value that's only correct for local (non-Docker) dev.
      - BACKEND_URL=http://backend:8001
    depends_on:
      - backend